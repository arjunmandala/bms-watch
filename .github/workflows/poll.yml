name: bms-poll
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test (no POST), live, or drill (Avengers webhook, no state)'
        default: 'test'
        type: choice
        options: [test, live, drill]
      extra:
        description: 'extra dates for test mode, comma-separated'
        default: ''
# Drill uses its own group so it can run beside a live poll and cannot cancel or queue it.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'drill') && 'bms-drill' || 'bms-poll' }}
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Stop after Sun 20 Dec 2026 23:59 IST
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'drill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -ge 1797791340 ]; then
            gh workflow disable poll.yml --repo "${{ github.repository }}"; echo "past stop time, disabled"; exit 1
          fi
      - uses: actions/checkout@v4
      - name: Restore fired-dates state
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'drill'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"fired_dates":[]}' > .fired-dates.json
          RESTORED=0
          if git fetch origin watch-state:watch-state 2>/dev/null; then
            if git show watch-state:fired-dates.json > .fired-dates.json 2>/dev/null; then
              echo "restored from watch-state branch"
              RESTORED=1
            fi
          fi
          echo "RESTORED_FROM_BRANCH=$RESTORED" >> "$GITHUB_ENV"
          echo "current state:"; cat .fired-dates.json
      - uses: actions/cache/restore@v4
        if: (github.event_name != 'workflow_dispatch' || inputs.mode != 'drill') && env.RESTORED_FROM_BRANCH != '1'
        continue-on-error: true
        with:
          path: .fired-dates.json
          key: dune-fired-dates-v1-${{ github.run_id }}
          restore-keys: |
            dune-fired-dates-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cloudflare WARP proxy (BMS blocks GitHub IPs)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp >/dev/null
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do
            if curl -sf -m 10 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'; then
              echo "BMS_PROXY=socks5h://127.0.0.1:40000" >> "$GITHUB_ENV"; echo "WARP up"; exit 0
            fi
            sleep 3
          done
          echo "WARP failed; poll.py will fall back to the jina relay"
      - name: Test (no webhook)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python poll.py --test --extra "${{ inputs.extra }}"
      - name: Drill (Avengers webhook, no state)
        id: drill
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'drill'
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: python poll.py --drill
      - name: Live poll
        id: live
        if: (github.event_name == 'schedule' && vars.LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        env:
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: python poll.py --duration 6900 --interval 45
      - name: Persist fired-dates state
        if: always() && ((github.event_name == 'schedule' && vars.LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -f .fired-dates.json ]; then echo "no state file"; exit 0; fi
          echo "persisting state:"; cat .fired-dates.json
          cp .fired-dates.json /tmp/fired-dates.json
          WORKDIR=$(mktemp -d)
          ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --heads origin watch-state | grep -q watch-state; then
            git clone --branch watch-state --single-branch "$ORIGIN" "$WORKDIR"
          else
            git clone --single-branch "$ORIGIN" "$WORKDIR"
            git -C "$WORKDIR" checkout --orphan watch-state
            git -C "$WORKDIR" rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi
          git -C "$WORKDIR" config user.name "bms-watch bot"
          git -C "$WORKDIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/fired-dates.json "$WORKDIR/fired-dates.json"
          git -C "$WORKDIR" add fired-dates.json
          if git -C "$WORKDIR" diff --staged --quiet; then
            echo "state unchanged"
          else
            git -C "$WORKDIR" commit -m "record fired Dune dates"
            git -C "$WORKDIR" push origin HEAD:watch-state
            echo "state pushed to watch-state"
          fi
          cp /tmp/fired-dates.json .fired-dates.json
      - name: Save fired-dates cache
        if: always() && ((github.event_name == 'schedule' && vars.LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live'))
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .fired-dates.json
          key: dune-fired-dates-v1-${{ github.run_id }}
      - name: Disable after all watched dates have fired
        if: steps.live.outputs.all_fired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable poll.yml --repo "${{ github.repository }}"
      - name: Chain next live run (GitHub cron is unreliable)
        if: always() && steps.live.outputs.all_fired != 'true' && ((github.event_name == 'schedule' && vars.LIVE == '1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%s)" -ge 1797791340 ]; then echo "past stop time"; exit 0; fi
          if [ "${{ steps.live.outcome }}" != "success" ]; then sleep 120; fi
          gh workflow run poll.yml --repo "${{ github.repository }}" -f mode=live
          echo "next run dispatched"
