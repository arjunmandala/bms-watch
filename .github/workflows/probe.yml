name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install curl_cffi
      - name: direct
        run: python probe.py direct || true
      - name: tor
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tor >/dev/null
          sudo systemctl start tor || sudo service tor start
          for i in $(seq 1 40); do curl -s --socks5-hostname 127.0.0.1:9050 https://api.ipify.org && break; sleep 3; done
          timeout 300 python probe.py tor socks5h://127.0.0.1:9050 || true
      - name: warp
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp >/dev/null
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status; curl -s -x socks5h://127.0.0.1:40000 https://api.ipify.org && break; sleep 3; done
          timeout 300 python probe.py warp socks5h://127.0.0.1:40000 || true
